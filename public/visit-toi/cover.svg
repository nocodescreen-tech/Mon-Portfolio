<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121316"/>
      <stop offset="0.55" stop-color="#17191e"/>
      <stop offset="1" stop-color="#1e2127"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="60%">
      <stop offset="0" stop-color="#ff6b00" stop-opacity="0.26"/>
      <stop offset="0.5" stop-color="#ff6b00" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ff6b00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6b00"/>
      <stop offset="1" stop-color="#ffa14d"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>

  <!-- orbes teinte fond -->
  <circle cx="1300" cy="180" r="300" fill="#ff6b00" opacity="0.08" filter="url(#blur)"/>
  <circle cx="220" cy="820" r="280" fill="#ff8a4d" opacity="0.07" filter="url(#blur)"/>

  <!-- motif grille pointillée géo -->
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="1.5" fill="none">
    <path d="M0 250 H1600 M0 500 H1600 M0 750 H1600 M400 0 V1000 M800 0 V1000 M1200 0 V1000"/>
  </g>

  <!-- pin de localisation stylisé -->
  <g transform="translate(800 430)">
    <ellipse cx="0" cy="150" rx="120" ry="18" fill="#000" opacity="0.4" filter="url(#blur)"/>
    <ellipse cx="0" cy="148" rx="92" ry="12" fill="#ff6b00" opacity="0.35"/>
    <g>
      <path d="M0 -210 C -95 -90 -150 -10 -150 62 A150 150 0 0 0 150 62 C150 -10 95 -90 0 -210 Z"
            fill="url(#brand)" opacity="0.96"/>
      <circle cx="0" cy="40" r="58" fill="#121316" opacity="0.35"/>
      <circle cx="0" cy="40" r="40" fill="#121316" opacity="0.55"/>
      <circle cx="0" cy="40" r="20" fill="#ff8a4d"/>
    </g>
    <!-- trait d'orbite -->
    <ellipse cx="0" cy="40" rx="210" ry="70" fill="none" stroke="#ff8a4d" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="4 10" transform="rotate(-18)"/>
  </g>

  <!-- typo -->
  <text x="800" y="790" text-anchor="middle" font-family="'Space Grotesk','Segoe UI',sans-serif" font-size="120" font-weight="600" fill="#f3f1ee" letter-spacing="-1">Visit<i>.</i>toi</text>
  <text x="800" y="850" text-anchor="middle" font-family="'Space Grotesk',sans-serif" font-size="34" fill="#ff8a4d" letter-spacing="6" opacity="0.9">PLATEFORME TOURISTIQUE • RDC</text>
  <text x="800" y="908" text-anchor="middle" font-family="Inter,sans-serif" font-size="26" fill="#f3f1ee" opacity="0.6">Explore les lieux, les cultures et les merveilles du Kongo</text>
</svg>